:root{--yellow:#FFC20E;--yellow-d:#E6A800;--ink-fix:#14140F;--bone:#F4F1E8;--asphalt:#10110E;
  --ease:cubic-bezier(.22,.8,.2,1);--spring:cubic-bezier(.34,1.45,.5,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'OP',system-ui,-apple-system,'Segoe UI',sans-serif;background:#0A0B09;color:#ECE9DF;font-weight:500;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
input{font-family:inherit;color:inherit}
svg{display:block}
.num{font-family:'OPM','OP',monospace;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ============ page chrome (desktop showcase) ============ */
.page{min-height:100vh;display:grid;grid-template-columns:minmax(380px,560px) auto minmax(280px,330px);gap:36px;justify-content:center;align-items:start;padding:28px 32px 40px;position:relative}
.page::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 40% at 50% 0%,rgba(255,194,14,.07),transparent 70%),
  repeating-linear-gradient(90deg,transparent 0 119px,rgba(255,255,255,.018) 119px 120px)}
.page>*{position:relative;z-index:1}
.stage{position:sticky;top:20px;display:flex;justify-content:center;align-items:flex-start}
.stage-box{width:calc(390px*var(--k,1) + 22px);height:calc(844px*var(--k,1) + 22px);position:relative}
.phone{width:390px;height:844px;position:absolute;left:11px;top:11px;transform:scale(var(--k,1));transform-origin:top left;border-radius:56px;background:#000;
  box-shadow:0 0 0 10px #1B1C18,0 0 0 11px #3A3C34,0 50px 90px -24px #000,0 0 120px -30px rgba(255,194,14,.18)}
.host{position:absolute;inset:0;border-radius:56px;overflow:hidden;background:var(--bg);color:var(--ink);isolation:isolate}
.island{position:absolute;top:11px;left:50%;width:118px;height:34px;margin-left:-59px;background:#000;border-radius:20px;z-index:90}
.homebar{position:absolute;bottom:8px;left:50%;width:138px;height:5px;margin-left:-69px;border-radius:3px;background:var(--ink);opacity:.9;z-index:95;pointer-events:none}

/* ============ themes ============ */
.host{--p-bg:var(--yellow);--p-fg:var(--ink-fix);--p-rim:var(--ink-fix)}
.host[data-th=light]{--bg:#ECE8DB;--bg2:#E3DECF;--card:#FAF8F0;--card2:#F2EFE4;--ink:#14140F;--ink2:#53544A;--ink3:#8B8C80;--line:#D7D2C2;--line2:#C6C1AE;
  --ok:#0C7A47;--bad:#C9231D;--blue:#1B55C9;--pri:#FFC20E;--pri-ink:#14140F;--shade:rgba(20,20,15,.08);--scrim:rgba(20,20,15,.45)}
.host[data-th=dark]{--bg:#12130F;--bg2:#181A15;--card:#1D1F19;--card2:#242620;--ink:#F4F1E8;--ink2:#B7B8AB;--ink3:#7D7E71;--line:#2D2F27;--line2:#3B3E34;
  --ok:#3FD17F;--bad:#FF5148;--blue:#6B9BFF;--pri:#FFC20E;--pri-ink:#14140F;--shade:rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6)}
.host[data-th=road-n]{--bg:#0C0D0B;--bg2:#141511;--card:#1A1C17;--card2:#22241E;--ink:#F6F3EA;--ink2:#C4C5B8;--ink3:#8A8B7E;--line:#2D2F27;--line2:#42453A;
  --ok:#3FD17F;--bad:#FF5148;--blue:#6B9BFF;--pri:#FFC20E;--pri-ink:#14140F;--shade:rgba(0,0,0,.5);--scrim:rgba(0,0,0,.72)}
.host[data-th=road-d]{--bg:#EFEBDD;--bg2:#E3DECF;--card:#FFFFFF;--card2:#F2EFE4;--ink:#0D0D0A;--ink2:#3F4037;--ink3:#74756A;--line:#D2CDBB;--line2:#B9B49F;
  --ok:#0C7A47;--bad:#C9231D;--blue:#1B55C9;--pri:#FFC20E;--pri-ink:#0D0D0A;--shade:rgba(20,20,15,.1);--scrim:rgba(20,20,15,.55)}

/* ============ status bar / tabbar ============ */
.sb{position:absolute;top:0;left:0;right:0;height:54px;padding:17px 30px 0 34px;display:flex;justify-content:space-between;align-items:flex-start;z-index:85;color:var(--ink);pointer-events:none;font-weight:700;font-size:16px}
.sb .num{font-size:16px;letter-spacing:0}
.sb .sbi{display:flex;gap:6px;align-items:center}
.sb.on-media{color:#fff}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:92px;padding:8px 14px 28px;display:flex;gap:6px;z-index:60;background:linear-gradient(to top,var(--bg) 62%,color-mix(in srgb,var(--bg) 0%,transparent));transition:transform .4s var(--ease),opacity .3s}
.tabbar.off{transform:translateY(110%);opacity:0;pointer-events:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:6px;color:var(--ink3);transition:color .2s;position:relative}
.tab .ti{width:52px;height:32px;border-radius:12px;display:grid;place-items:center;transition:background .25s var(--ease),transform .25s var(--spring)}
.tab span{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.tab.on{color:var(--ink)}
.tab.on .ti{background:var(--pri);color:var(--pri-ink)}
.tab:active .ti{transform:scale(.92)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 10px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}

/* ============ screens ============ */
.screen{position:absolute;inset:0;background:var(--bg);color:var(--ink);overflow:hidden;opacity:0;pointer-events:none;visibility:hidden}
.screen.on{opacity:1;pointer-events:auto;visibility:visible;z-index:5}
.screen.enter-f{animation:inF .42s var(--ease) both}
.screen.enter-b{animation:inB .38s var(--ease) both}
.screen.enter-t{animation:inT .3s ease both}
.screen.leave{visibility:visible;z-index:4;animation:outAny .3s ease both}
@keyframes inF{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inT{from{opacity:0}to{opacity:1}}
@keyframes outAny{to{opacity:0}}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:60px 20px 120px}
.scroll::-webkit-scrollbar{display:none}
.scroll.nopad-b{padding-bottom:40px}
.scroll.tabs{padding-bottom:116px}

/* ============ type ============ */
.t-display{font-size:44px;line-height:.98;font-weight:900;letter-spacing:-.035em}
.t-h1{font-size:32px;line-height:1.02;font-weight:850;letter-spacing:-.03em}
.t-h2{font-size:22px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.t-h3{font-size:17px;line-height:1.2;font-weight:750;letter-spacing:-.01em}
.t-body{font-size:16px;line-height:1.38;font-weight:500;color:var(--ink2)}
.t-sm{font-size:13.5px;line-height:1.35;font-weight:500;color:var(--ink2)}
.t-label{font-size:11px;line-height:1;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3)}
.ink{color:var(--ink)}.ink3{color:var(--ink3)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.row{display:flex;align-items:center;gap:12px}.col{display:flex;flex-direction:column}
.sp{flex:1}.g4{gap:4px}.g8{gap:8px}.g16{gap:16px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}

/* ============ road-paint divider ============ */
.cl{height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--pri) 0 16px,transparent 16px 30px);opacity:.95}
.cl.dim{opacity:.35}

/* ============ buttons ============ */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:58px;padding:0 22px;border-radius:18px;font-size:17px;font-weight:800;letter-spacing:-.01em;width:100%;position:relative;
  transition:transform .18s var(--spring),filter .2s,background .2s;user-select:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:var(--pri-ink);box-shadow:0 2px 0 rgba(0,0,0,.22),inset 0 0 0 1.5px rgba(0,0,0,.14)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line2)}
.btn.soft{background:var(--card2);color:var(--ink)}
.btn.bad{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{height:44px;font-size:15px;border-radius:14px;padding:0 16px;width:auto}
.btn.xs{height:36px;font-size:13.5px;border-radius:12px;padding:0 13px;width:auto}
.btn[disabled],.btn.dis{opacity:.4;pointer-events:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .15s var(--spring)}
.iconbtn:active{transform:scale(.92)}
.link{color:var(--ink);font-weight:800;text-decoration:underline;text-decoration-color:var(--pri);text-decoration-thickness:3px;text-underline-offset:4px}

/* ============ plates (road-sign language) ============ */
.plate{position:relative;border-radius:18px;padding:14px 18px;background:var(--p-bg);color:var(--p-fg);display:flex;align-items:center;gap:14px}
.plate::before{content:'';position:absolute;inset:4px;border-radius:14px;border:2px solid var(--p-rim);opacity:.92;pointer-events:none}
.plate.green{--p-bg:#0C7A47;--p-fg:#fff;--p-rim:#fff}
.plate.yellow{--p-bg:#FFC20E;--p-fg:#14140F;--p-rim:#14140F}
.plate.red{--p-bg:#D92B24;--p-fg:#fff;--p-rim:#fff}
.plate.white{--p-bg:#F4F1E8;--p-fg:#14140F;--p-rim:#14140F}
.plate.black{--p-bg:#14140F;--p-fg:#F4F1E8;--p-rim:#F4F1E8}
.plate.blue{--p-bg:#1B55C9;--p-fg:#fff;--p-rim:#fff}
.plate .pt{font-size:26px;line-height:1;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
.plate .ps{font-size:13.5px;font-weight:650;opacity:.85;margin-top:4px;line-height:1.1}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--card2);color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--line)}
.pill.y{background:var(--pri);color:var(--pri-ink);box-shadow:none}
.pill.g{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);box-shadow:none}
.pill.r{background:var(--bad);color:#fff;box-shadow:none}
.pill.k{background:var(--ink);color:var(--bg);box-shadow:none}

/* ============ cards, lists ============ */
.card{background:var(--card);border-radius:22px;box-shadow:inset 0 0 0 1.5px var(--line),0 10px 24px -18px var(--shade);position:relative}
.card.pad{padding:18px}
.list{background:var(--card);border-radius:22px;box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:15px 16px;min-height:62px;width:100%;position:relative;transition:background .15s}
.li+.li::before{content:'';position:absolute;top:0;left:16px;right:16px;height:1.5px;background:var(--line)}
.li:active{background:var(--card2)}
.li .lt{font-size:16.5px;font-weight:750;letter-spacing:-.01em;line-height:1.15}
.li .ls{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.25;font-weight:500}
.lic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--card2);color:var(--ink);flex:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.lic.y{background:var(--pri);color:var(--pri-ink);box-shadow:none}
.chev{color:var(--ink3);flex:none}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 12px}
.sec:first-child{margin-top:0}

/* ============ avatars ============ */
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:850;letter-spacing:.02em;color:#10110E;flex:none;position:relative;box-shadow:0 0 0 2.5px var(--bg)}
.avs{display:flex}.avs .av+.av{margin-left:-9px}
.av.me{background:var(--pri)!important}
.av.lg{width:56px;height:56px;font-size:18px}.av.xl{width:76px;height:76px;font-size:24px}.av.sm{width:28px;height:28px;font-size:10.5px}

/* ============ segmented / chips / toggle ============ */
.seg{display:flex;padding:4px;border-radius:16px;background:var(--card2);box-shadow:inset 0 0 0 1.5px var(--line);gap:2px}
.seg button{flex:1;height:40px;border-radius:12px;font-size:14.5px;font-weight:800;color:var(--ink2);transition:all .22s var(--ease);text-align:center}

.chip{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:21px;font-size:15px;font-weight:750;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2);transition:all .2s var(--ease)}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.chip:active{transform:scale(.96)}
.tg{width:54px;height:32px;border-radius:16px;background:var(--line2);position:relative;flex:none;transition:background .25s}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .28s var(--spring)}
.tg.on{background:var(--ok)}.tg.on::after{transform:translateX(22px)}

/* ============ inputs ============ */
.field{width:100%;height:60px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line2);padding:0 18px;font-size:19px;font-weight:700;border:0;outline:0;color:var(--ink);letter-spacing:-.01em;transition:box-shadow .2s}
.field:focus{box-shadow:inset 0 0 0 3px var(--ink)}
.field::placeholder{color:var(--ink3);font-weight:600}
.flabel{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-left:2px;margin-bottom:8px;display:block}

/* ============ sheets / toasts / overlays ============ */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:120;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:125;background:var(--bg);color:var(--ink);border-radius:30px 30px 0 0;padding:12px 20px 38px;transform:translateY(105%);transition:transform .46s var(--ease);max-height:88%;overflow-y:auto;scrollbar-width:none;box-shadow:0 -20px 50px -20px rgba(0,0,0,.5)}
.sheet::-webkit-scrollbar{display:none}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 18px}
.toasts{position:absolute;top:62px;left:14px;right:14px;z-index:140;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.toast{pointer-events:auto;animation:toastIn .5s var(--spring) both;max-width:100%}
.toast.out{animation:toastOut .3s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(-18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px) scale(.96)}}
.toast .plate{padding:11px 16px;border-radius:16px}
.toast .plate .pt{font-size:15.5px;letter-spacing:-.005em;text-transform:none;font-weight:800}
.overlay{position:absolute;inset:0;z-index:130;opacity:0;pointer-events:none;visibility:hidden}
.overlay.on{opacity:1;pointer-events:auto;visibility:visible;animation:ovIn .35s var(--ease) both}
@keyframes ovIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.blink{animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.25}}
@keyframes flipIn{from{transform:perspective(600px) rotateX(-70deg);opacity:0}to{transform:none;opacity:1}}
.flip{animation:flipIn .5s var(--ease) both;transform-origin:top}

.key{display:grid;place-items:center;text-align:center}

.dt{display:inline-block;width:.27em;height:.27em;min-width:3px;min-height:3px;border-radius:50%;background:currentColor;opacity:.55;margin:0 .5em;vertical-align:.28em}
.avs .av:not(:last-child){padding-right:9px}
.hf{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit;background:rgba(255,255,255,.32);pointer-events:none}
.rrsvg{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);pointer-events:none;opacity:0;color:#fff}
.ctl.sos.arm .rrsvg{opacity:1}
.screen>div[style*='bottom:']{z-index:7}
.scroll.has-cta{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - var(--m1)),transparent calc(100% - var(--m0)));mask-image:linear-gradient(to bottom,#000 calc(100% - var(--m1)),transparent calc(100% - var(--m0)))}
/* ===== ticket (ride pass) ===== */
.ticket{border-radius:26px;background:var(--card);overflow:hidden;position:relative;box-shadow:inset 0 0 0 1.5px var(--line),0 18px 34px -22px var(--shade)}
.ticket canvas{display:block;width:100%;height:158px;background:#E9E4D5}
.perf{position:relative;height:0;border-top:2px dashed var(--line2);margin:0 18px}
.perf::before,.perf::after{content:'';position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line)}
.perf::before{left:-30px}.perf::after{right:-30px}
.tk-body{padding:16px 18px 18px}
.kv{display:flex;gap:0}
.kv>div{flex:1}
.kv .v{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1}
.kv .k{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-top:6px}
.chk{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 8px;border-radius:17px;background:var(--card2);font-size:13px;font-weight:750;box-shadow:inset 0 0 0 1.5px var(--line)}
.chk i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff}
.chk.warn i{background:var(--pri);color:#14140F}
.mini{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.mini::-webkit-scrollbar{display:none}
.mini>*{flex:none}
.bars{display:flex;align-items:flex-end;gap:8px;height:74px}
.bars span{flex:1;border-radius:6px 6px 3px 3px;background:var(--line2);min-height:6px;position:relative}
.bars span.on{background:var(--pri)}
.bars span b{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:.06em}
.ringsvg{width:100%;height:100%}
.ringsvg .rg{transition:stroke-dashoffset .1s linear}
.mp{position:relative;padding-left:26px}
.mp::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:3px;background:repeating-linear-gradient(to bottom,var(--line2) 0 6px,transparent 6px 11px)}
.mp>div{position:relative;padding:0 0 16px}
.mp>div::before{content:'';position:absolute;left:-26px;top:3px;width:13px;height:13px;border-radius:4px;transform:rotate(45deg);background:var(--pri);box-shadow:inset 0 0 0 2px var(--ink)}
.mp>div.k::before{background:var(--ink)}
.mp>div.r::before{background:var(--bad)}
.mp>div.g::before{background:var(--ok)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;background:var(--line2);outline:0}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 3px var(--ink);cursor:pointer}
/* ===== ROAD (live) ===== */
.road-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.vig-b{position:absolute;left:0;right:0;bottom:0;height:380px;background:linear-gradient(to top,var(--bg) 52%,transparent);pointer-events:none}
.ladder{position:absolute;left:10px;top:150px;width:92px;height:420px;pointer-events:none}
.ladder::before{content:'';position:absolute;left:30px;top:0;bottom:0;width:4px;border-radius:2px;background:repeating-linear-gradient(to bottom,var(--pri) 0 10px,transparent 10px 18px);opacity:.55}
.ld{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;transition:transform .35s linear,opacity .3s;will-change:transform}
.ld .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:900;color:#10110E;box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px rgba(255,255,255,.0);position:relative;z-index:2}
.ld .gp{font-family:'OPM';font-weight:700;font-size:12px;letter-spacing:-.02em;color:var(--ink);background:color-mix(in srgb,var(--bg) 78%,transparent);padding:2px 5px;border-radius:5px;white-space:nowrap}

.ld.str .dot{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--pri);animation:pulse 1s ease-in-out infinite}
.ld.str .gp{background:var(--pri);color:#14140F}
.ld.stale .dot{background:transparent!important;color:var(--ink3);box-shadow:inset 0 0 0 2.5px var(--ink3);border:0}
.ld.stale .gp{color:var(--ink3)}
.ld.sos .dot{background:var(--bad)!important;color:#fff;animation:pulse .6s ease-in-out infinite}
.ld.talk .dot{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ok)}
.ld .nm{font-size:12px;font-weight:850;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:3px 7px;border-radius:6px;white-space:nowrap}
.cluster{position:absolute;left:18px;right:18px;top:586px;display:flex;align-items:flex-end;gap:12px;pointer-events:none}
.spd{font-size:122px;line-height:.8;letter-spacing:-.07em;color:var(--ink);text-shadow:0 2px 0 var(--bg)}
.unit{font-size:15px;font-weight:850;letter-spacing:.14em;color:var(--ink2);margin-top:8px}
.kvx{display:flex;flex-direction:column;gap:8px;align-items:flex-end;margin-left:auto;padding-bottom:6px}
.kvx .a{font-size:34px;line-height:1;font-weight:700}.kvx .b{font-size:11px;font-weight:850;letter-spacing:.14em;color:var(--ink2);text-transform:uppercase;margin-top:-4px}
.ctls{position:absolute;left:14px;right:14px;bottom:30px;display:grid;grid-template-columns:96px 1fr 1fr 1fr;gap:10px}

.ctl:active{transform:scale(.95)}
.ctl.sos{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 3px var(--bad)}

.glove .ctl{height:104px}.glove .ctls{bottom:26px}.glove .spd{font-size:132px}
.ctl.talk{background:var(--ok);color:#fff}
.sidebtn{position:absolute;right:14px;width:62px;height:62px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line2);display:grid;place-items:center;color:var(--ink);font-size:10px;font-weight:900;letter-spacing:.1em;pointer-events:auto}
.limit{position:absolute;right:14px;top:226px;width:62px;height:62px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px #D92B24 inset,0 0 0 2px rgba(0,0,0,.2);display:grid;place-items:center;color:#14140F;font-size:24px}
.plate-wrap{position:absolute;top:58px;left:14px;right:14px;z-index:20}
.sosvig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(120% 80% at 50% 100%,rgba(217,43,36,.6),transparent 70%);z-index:30}
.sosvig.on{opacity:1}
.tile{border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:8px;padding:0 22px;height:122px;font-size:29px;font-weight:900;letter-spacing:-.03em;text-transform:uppercase;line-height:.95;text-align:left;transition:transform .15s var(--spring);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}

.hz{height:92px;border-radius:20px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;box-shadow:inset 0 0 0 2px var(--line2)}
.hz:active{transform:scale(.95)}
.wave{display:flex;gap:4px;align-items:center;height:30px}
.wave i{display:block;width:5px;border-radius:3px;background:currentColor;animation:wv .8s ease-in-out infinite}
@keyframes wv{0%,100%{height:6px}50%{height:28px}}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
.rtile{border-radius:22px;background:var(--card);padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:inset 0 0 0 2px var(--line);text-align:center;position:relative;transition:box-shadow .3s}
.rtile.ready{box-shadow:inset 0 0 0 3px var(--ok)}

.fm-title{font-size:30px;font-weight:900;letter-spacing:-.035em;line-height:1}
.fm-sub{font-size:14px;line-height:1.45;color:#B5B6A9;margin-top:10px}

.mode{border-radius:16px;padding:14px;font-size:12.5px;line-height:1.35}

.jr button.done i{background:#3FD17F;color:#10110E}
.nextb{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:14px;background:#FFC20E;color:#14140F;font-weight:850;font-size:15px;width:100%}

.fl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:800;background:#1F211A;color:#D9D6CC;box-shadow:inset 0 0 0 1px #2C2F26;transition:all .15s}
