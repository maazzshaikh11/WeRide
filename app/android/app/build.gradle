apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Run R8 (code shrinking + obfuscation) and resource shrinking on Release builds.
 * Keep rules for the native libraries live in proguard-rules.pro; see docs/SECURITY.md for what to verify on a device
 * after changing either.
 */
def enableProguardInReleaseBuilds = true

/**
 * Release signing. The release build is signed with YOUR upload/release key, never the debug key.
 * Credentials come from (first match wins), none of which is committed to git:
 *   1. android/keystore.properties (git-ignored; copy keystore.properties.example)
 *   2. Gradle properties, e.g. ~/.gradle/gradle.properties:  WERIDE_RELEASE_STORE_FILE=... etc.
 *   3. Environment variables (CI):                           WERIDE_RELEASE_STORE_FILE=... etc.
 * Keys: STORE_FILE, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD. If any is missing, any build that includes a release task FAILS.
 */
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseSigningValue = { String key ->
    def v = keystoreProperties.getProperty(key) ?: project.findProperty("WERIDE_RELEASE_" + key) ?: System.getenv("WERIDE_RELEASE_" + key)
    return (v == null || v.toString().trim().isEmpty()) ? null : v.toString().trim()
}
def releaseStoreFile = releaseSigningValue("STORE_FILE")
def hasReleaseSigning = ["STORE_FILE", "STORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD"].every { releaseSigningValue(it) != null } &&
        rootProject.file(releaseStoreFile ?: "missing").exists()

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { it.path.startsWith(project.path + ":") && it.name =~ /(?i)release/ }
    if (releaseRequested && !hasReleaseSigning) {
        throw new GradleException(
            "Release signing is not configured, refusing to build a release (it would be signed with the debug key).\n" +
            "Create android/keystore.properties (see keystore.properties.example) or set WERIDE_RELEASE_STORE_FILE, " +
            "WERIDE_RELEASE_STORE_PASSWORD, WERIDE_RELEASE_KEY_ALIAS, WERIDE_RELEASE_KEY_PASSWORD as Gradle properties or environment variables, " +
            "and make sure the keystore file exists.")
    }
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.weride"
    defaultConfig {
        applicationId "com.weride"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Only populated when all four values are present; otherwise the taskGraph check above stops release builds.
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseSigningValue("STORE_PASSWORD")
                keyAlias releaseSigningValue("KEY_ALIAS")
                keyPassword releaseSigningValue("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // NEVER signingConfigs.debug here: the debug key is public, anyone could ship an "update" to our users.
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:flipper-integration")

    // react-native-background-geolocation logging: ensure logback-android is
    // packaged in the app, else TSLog crashes with a slf4j ClassCastException.
    implementation("com.github.tony19:logback-android:2.0.1")
    implementation("org.slf4j:slf4j-api:1.7.36")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
